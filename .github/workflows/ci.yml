name: Capital City Provisions CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - preflight
  pull_request:
    branches:
      - main
      - preflight

permissions:
  contents: read

concurrency:
  group: ccp-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 20
          cache: npm

      - name: Verify inert install policy
        run: test "$(npm config get ignore-scripts)" = true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify typecheck, license audit, and build
        run: npm run verify
