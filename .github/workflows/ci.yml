name: Capital City Provisions CI

on:
  push:
    branches:
      - main
      - preflight
  pull_request:
    branches:
      - main
      - preflight

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify typecheck, license audit, and build
        run: npm run verify
